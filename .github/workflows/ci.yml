name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      firebird:
        image: firebirdsql/firebird:5
        env:
          FIREBIRD_ROOT_PASSWORD: masterkey
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_USER: SYSDBA
          FIREBIRD_PASSWORD: masterkey
        ports:
          - 3050:3050
        options: >-
          --health-cmd "/bin/bash -c 'echo > /dev/tcp/localhost/3050'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Firebird client library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfbclient2
          # Provide libfbclient.so symlink expected by node-firebird-driver-native
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libfbclient.so.2 \
                      /usr/lib/x86_64-linux-gnu/libfbclient.so

      - name: Install root dependencies
        run: npm install

      - name: Build packages
        run: npm run build -w packages/firebird-wasm

      # ESLint over the package's TypeScript (it had a script and dependencies but no configuration)
      - name: Lint
        run: npm run lint

      - name: Run unit tests
        working-directory: packages/firebird-wasm
        env:
          FIREBIRD_HOST: localhost
          FIREBIRD_USER: SYSDBA
          FIREBIRD_PASSWORD: masterkey
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: packages/firebird-wasm/coverage/
          if-no-files-found: ignore

      # Decode-time regression guard — see docs/plans/typed-results.md.
      # Runs here rather than in a job of its own because it needs the build
      # this job already did, and asserts only on ratios measured within the
      # run, so a slow or shared runner changes the numbers without changing
      # the verdict.
      - name: Decode benchmark
        working-directory: packages/firebird-wasm
        run: npm run bench -- bench-results/decode.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decode-benchmark
          path: packages/firebird-wasm/bench-results/
          if-no-files-found: ignore

  # The Node driver against every supported server. FirebirdLite talks to a
  # server through libfbclient, so what it supports is what these pass on.
  # (The browser engine is built from Firebird's master branch and reports
  # 6.0; testing other engine versions there means building each one.)
  server-versions:
    name: Firebird ${{ matrix.firebird }} server
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        firebird: ['3', '4', '5']

    services:
      firebird:
        image: firebirdsql/firebird:${{ matrix.firebird }}
        env:
          FIREBIRD_ROOT_PASSWORD: masterkey
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_USER: SYSDBA
          FIREBIRD_PASSWORD: masterkey
        ports:
          - 3050:3050
        options: >-
          --health-cmd "/bin/bash -c 'echo > /dev/tcp/localhost/3050'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Firebird client library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfbclient2
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libfbclient.so.2 \
                      /usr/lib/x86_64-linux-gnu/libfbclient.so

      - name: Install root dependencies
        run: npm install

      # FIREBIRD_REQUIRE_SERVER fails the run if the client library cannot
      # load, where the suite would otherwise skip itself and pass;
      # FIREBIRD_EXPECT_MAJOR checks the server is the version named here.
      - name: Run the server-backed tests
        working-directory: packages/firebird-wasm
        env:
          FIREBIRD_HOST: localhost
          FIREBIRD_USER: SYSDBA
          FIREBIRD_PASSWORD: masterkey
          FIREBIRD_REQUIRE_SERVER: '1'
          FIREBIRD_EXPECT_MAJOR: ${{ matrix.firebird }}
        run: npx jest src/__tests__/firebird.test.ts
