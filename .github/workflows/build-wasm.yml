name: Build WASM

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      firebird_ref:
        description: 'Firebird git ref (master or v5.0-release)'
        required: false
        default: 'master'

jobs:
  build-wasm:
    name: Build Firebird WASM
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # The vendored SDK, not a separately installed one.  Building the engine
      # against a different Emscripten than the pinned version produces an
      # artifact that links cleanly and then aborts inside the engine at
      # runtime, so the toolchain is part of the source, not of the runner.
      - name: Read the pinned Emscripten version
        id: emsdk
        run: |
          echo "version=$(tr -d '[:space:]' \
            < packages/firebird-wasm/wasm/emsdk-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache the Emscripten toolchain
        uses: actions/cache@v4
        with:
          # `upstream/` holds the downloaded clang and binaryen — around a
          # gigabyte, and identical for a given version.
          path: |
            third_party/emsdk/upstream
            third_party/emsdk/node
            third_party/emsdk/.emscripten
          key: emsdk-${{ runner.os }}-${{ steps.emsdk.outputs.version }}

      - name: Set up the vendored Emscripten SDK
        working-directory: third_party/emsdk
        run: |
          set -euo pipefail
          ./emsdk install "${{ steps.emsdk.outputs.version }}"
          ./emsdk activate "${{ steps.emsdk.outputs.version }}"
          # Each `run` block is a fresh shell, so export the activated
          # environment rather than sourcing emsdk_env.sh in every step.
          source ./emsdk_env.sh
          # Which variables emsdk_env.sh sets varies by version — this one
          # leaves EM_CONFIG unset — so forward only what is actually there.
          # Naming one unconditionally trips `set -u` and fails the build.
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          for var in EMSDK EMSDK_NODE EM_CONFIG EMSDK_PYTHON; do
            if [ -n "${!var:-}" ]; then
              echo "$var=${!var}" >> "$GITHUB_ENV"
            fi
          done

      - name: Confirm the toolchain
        run: emcc --version | head -1

      - name: Install build tools for Firebird native configure
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git libicu-dev icu-devtools

      - name: Cache native config
        uses: actions/cache@v4
        with:
          path: |
            packages/firebird-wasm/wasm/build-native-config
          key: firebird-native-config-v5.0.4-${{ hashFiles('packages/firebird-wasm/wasm/build.sh') }}


      - name: Install root dependencies
        run: npm install

      # Both builds: the threaded one and firebird-embedded-st, without threads.
      - name: Build WASM modules (compile Firebird with Emscripten)
        run: npm run build:wasm -w packages/firebird-wasm

      # Incremental rebuild check (roadmap §M6): re-runs build.sh after wiping
      # build-native-config and the patch marker and touching a source file,
      # verifying that patches re-check idempotently, btyacc/parse and
      # gpre_boot rebuild cleanly against a tree that already holds the 32-bit
      # WASM autoconfig.h, and the Emscripten CMake build only recompiles the
      # touched translation unit rather than every file that includes
      # autoconfig.h or parse.h.
      - name: Incremental WASM rebuild check
        working-directory: packages/firebird-wasm
        run: |
          set -euo pipefail
          UNTOUCHED_OBJ="wasm/build-st/CMakeFiles/firebird-embedded.dir/fb_wasm_stubs.cpp.o"
          TOUCHED_OBJ="wasm/build-st/CMakeFiles/firebird-embedded.dir/fb_wasm_api.cpp.o"
          BEFORE_UNTOUCHED="$(stat -c %Y "$UNTOUCHED_OBJ")"
          BEFORE_TOUCHED="$(stat -c %Y "$TOUCHED_OBJ")"
          sleep 2
          rm -rf wasm/build-native-config
          rm -f wasm/firebird-src/.wasm-patches-applied
          touch wasm/fb_wasm_api.cpp
          npm run build:wasm
          AFTER_UNTOUCHED="$(stat -c %Y "$UNTOUCHED_OBJ")"
          AFTER_TOUCHED="$(stat -c %Y "$TOUCHED_OBJ")"
          test -f wasm/build-native-config/src/bin/gpre_boot
          test -f wasm/firebird-src/.wasm-patches-applied
          test "$AFTER_TOUCHED" -gt "$BEFORE_TOUCHED"
          test "$AFTER_UNTOUCHED" -eq "$BEFORE_UNTOUCHED"

      - name: Build TypeScript package
        run: npm run build -w packages/firebird-wasm

      # Raw, gzip and brotli sizes of each artifact; fails past the budget.
      - name: Size budget
        run: npm run size -w packages/firebird-wasm

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: firebird-wasm
          path: |
            packages/firebird-wasm/dist/wasm/firebird-embedded.js
            packages/firebird-wasm/dist/wasm/firebird-embedded.wasm
            packages/firebird-wasm/dist/wasm/firebird-embedded-st.js
            packages/firebird-wasm/dist/wasm/firebird-embedded-st.wasm
          if-no-files-found: error
          retention-days: 90

      # ── WASM tests ────────────────────────────────────────────────────────

      - name: Run WASM console (Node.js) integration tests
        working-directory: packages/firebird-wasm
        # wasm-integration runs once per build; wasm-single-thread checks what
        # is particular to the build without threads.
        env:
          FB_EXPECTED_ENGINE_PREFIX: '6.0.'
        run: npx jest --testPathPattern='wasm-(integration|single-thread)' --forceExit

      - name: Install Playwright browsers for WASM browser tests
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # A real Postgres and Electric for browser-electric.spec.ts, which
      # syncs from them into the engine. Steps rather than service
      # containers: Postgres needs wal_level=logical, a server argument
      # services cannot pass.
      - name: Start Postgres and Electric
        run: |
          docker network create electric
          docker run -d --name pg --network electric -p 54321:5432 \
            -e POSTGRES_PASSWORD=pg postgres:16 -c wal_level=logical
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker run -d --name electric --network electric -p 3000:3000 \
            -e DATABASE_URL=postgresql://postgres:pg@pg:5432/postgres \
            -e ELECTRIC_INSECURE=true electricsql/electric:1.8.1
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/v1/health && break
            sleep 1
          done

      # And a Firebird server, for browser-firebird-shapes.spec.ts: its
      # tables served by firebird-wasm/electric-server into the engine. The
      # shape server runs in the test process, through the native client.
      - name: Start a Firebird server, and install its client library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfbclient2
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libfbclient.so.2 \
                      /usr/lib/x86_64-linux-gnu/libfbclient.so
          docker run -d --name firebird -p 3050:3050 -p 3051:3051 \
            -e FIREBIRD_CONF_RemoteAuxPort=3051 \
            -e FIREBIRD_ROOT_PASSWORD=masterkey firebirdsql/firebird:5
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/3050) 2>/dev/null && break
            sleep 1
          done

      - name: Run WASM browser (Playwright) e2e tests
        working-directory: e2e
        env:
          CI: 'true'
          ELECTRIC_URL: http://localhost:3000
          PG_URL: postgresql://postgres:pg@localhost:54321/postgres
          FIREBIRD_SHAPES_HOST: localhost
          FIREBIRD_SHAPES_PASSWORD: masterkey
        run: npx playwright test --config playwright.wasm.config.ts

      - name: Run demo site (Playwright) e2e tests
        working-directory: e2e
        env:
          CI: 'true'
        # Serves the built site with no COOP/COEP, exactly as GitHub Pages
        # does, so a demo that only works behind a helpful dev server fails
        # here rather than after it is published.
        run: npx playwright test --config playwright.demo.config.ts

      # The example apps, each built by its own bundler from the package as
      # just built, then run in Chromium with and without cross-origin
      # isolation (the threaded engine and the build without threads).
      - name: Build the Vite, webpack and Electric examples
        run: |
          for example in vite webpack electric; do
            (cd examples/$example && npm install --no-audit --no-fund && npm run build)
          done

      # examples/electric's server syncs from the Postgres, Electric and
      # Firebird containers started above.
      - name: Run the example apps (Playwright)
        working-directory: e2e
        env:
          CI: 'true'
          ELECTRIC_URL: http://localhost:3000
          PG_URL: postgresql://postgres:pg@localhost:54321/postgres
          FIREBIRD_SHAPES_HOST: localhost
          FIREBIRD_SHAPES_PASSWORD: masterkey
        run: npx playwright test --config playwright.examples.config.ts

      - name: Upload demo Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-demo
          path: e2e/playwright-report-demo/
          retention-days: 30

      - name: Upload WASM Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-wasm
          path: e2e/playwright-report-wasm/
          retention-days: 30

  build-wasm-v5:
    name: Build Firebird 5.0 LTS WASM (v5.0-release)
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Read the pinned Emscripten version
        id: emsdk
        run: |
          echo "version=$(tr -d '[:space:]' \
            < packages/firebird-wasm/wasm/emsdk-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache the Emscripten toolchain
        uses: actions/cache@v4
        with:
          path: |
            third_party/emsdk/upstream
            third_party/emsdk/node
            third_party/emsdk/.emscripten
          key: emsdk-${{ runner.os }}-${{ steps.emsdk.outputs.version }}

      - name: Set up the vendored Emscripten SDK
        working-directory: third_party/emsdk
        run: |
          set -euo pipefail
          ./emsdk install "${{ steps.emsdk.outputs.version }}"
          ./emsdk activate "${{ steps.emsdk.outputs.version }}"
          source ./emsdk_env.sh
          echo "PATH=$PATH" >> "$GITHUB_ENV"
          for var in EMSDK EMSDK_NODE EM_CONFIG EMSDK_PYTHON; do
            if [ -n "${!var:-}" ]; then
              echo "$var=${!var}" >> "$GITHUB_ENV"
            fi
          done

      - name: Install build tools for Firebird native configure
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git libicu-dev icu-devtools

      - name: Cache native config (v5.0-release)
        uses: actions/cache@v4
        with:
          path: |
            packages/firebird-wasm/wasm/build-native-config
          key: firebird-native-config-v5.0-release-${{ hashFiles('packages/firebird-wasm/wasm/build.sh') }}

      - name: Install root dependencies
        run: npm install

      - name: Build Firebird 5.0 LTS WASM modules (v5.0-release)
        env:
          FB_GIT_REF: v5.0-release
        run: npm run build:wasm -w packages/firebird-wasm

      - name: Build TypeScript package
        run: npm run build -w packages/firebird-wasm

      - name: Upload Firebird 5.0 LTS WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: firebird-wasm-v5.0
          path: |
            packages/firebird-wasm/dist/wasm/firebird-embedded.js
            packages/firebird-wasm/dist/wasm/firebird-embedded.wasm
            packages/firebird-wasm/dist/wasm/firebird-embedded-st.js
            packages/firebird-wasm/dist/wasm/firebird-embedded-st.wasm
          if-no-files-found: error
          retention-days: 90

      - name: Run WASM console (Node.js) integration tests against Firebird 5.0 LTS
        working-directory: packages/firebird-wasm
        env:
          FB_EXPECTED_ENGINE_PREFIX: '5.0.'
        run: npx jest --testPathPattern='wasm-(integration|single-thread)' --forceExit
